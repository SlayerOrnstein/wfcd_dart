version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "daily"
      time: "00:00"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "master"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
