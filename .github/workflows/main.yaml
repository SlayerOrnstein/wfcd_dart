name: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/main.yaml"
      - "packages/**"
      - "pubspec.yaml"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/main.yaml"
      - "packages/**"
      - "pubspec.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install Melos
        run: dart pub global activate melos
      - name: Install Dependencies
        run: dart pub get
      - name: Check Formatting
        run: melos format --line-length 120 --set-exit-if-changed
      - name: Analyze
        run: melos analyze
      - name: Test
        run: melos test
