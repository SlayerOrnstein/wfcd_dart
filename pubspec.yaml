name: wfcd_dart
repository: https://github.com/SlayerOrnstein/wfcd_dart

environment:
  sdk: "^3.11.0"

workspace:
  - packages/*

dev_dependencies:
  build_runner: ^2.15.1
  melos: ^8.2.2
  very_good_analysis: 10.3.0

melos:
  scripts:
    build_runner:clean:
      run: melos exec --depends-on build_runner -- dart run build_runner clean
    build_runner:build:
      run: melos exec --depends-on build_runner -- dart run build_runner build
    build_runner:watch:
      run: melos exec --depends-on build_runner -- dart run build_runner watch
    analyze:
      run: melos exec -- dart analyze --fatal-infos --fatal-warnings
    test:
      run: melos exec --depends-on test -- dart test
  command:
    version:
      branch: master
      updateGitTagRefs: true
      releaseUrl: true
      message: |
        chore(release): publish packages [skip ci]

        {new_package_versions}
